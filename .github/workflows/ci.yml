name: ci

# Runs on the self-hosted ARC scale set `safewords-runners`.
# Pull requests from forks never run on self-hosted runners: they could execute
# arbitrary code inside the cluster hosting the runners.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: safewords-runners
    container: rust:1-bookworm
    steps:
      - uses: actions/checkout@v4
      - run: rustup component add clippy rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
